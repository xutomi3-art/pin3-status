<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 禁缓存：换口令后旧页面还在缓存里，用新口令解旧密文必然失败，
     用户看到的是「口令不对」而不是「页面过期」—— 09-03 就踩了这个，
     排查方向完全被带偏。页面很小（70KB），不值得为省流量冒这个险。 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PinBot 快照</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#777;--line:#e5e5e5;--bad:#d33}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e8e8;--mut:#999;--line:#2a2d33}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);
     font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
/* 快照本来是照手机设计的，没设最大宽度。09-04 在 1512px 的 Mac 上看，
   标签和数字被 flex 拉到隔着一千多像素，眼睛要横扫整屏才能对上一行 —— 
   宽屏不是「更好看」，是更难读。960px 之后不再加宽，多出来的留白居中。 */
#app{max-width:960px;margin:0 auto}
/* 宽屏时卡片两两并排，纵向不用滚那么长；窄屏（手机）自动退回单列。 */
@media(min-width:760px){
  #body{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  .card{margin:0 0 14px}
  .card.full{grid-column:1/-1}
}
h1{font-size:17px;margin:0 0 4px}
.mut{color:var(--mut)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.big{font-size:26px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}
code{font:12px ui-monospace,Menlo,Consolas,monospace}
input,button{font:15px inherit;padding:9px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{background:var(--fg);color:var(--bg);border:0;font-weight:600;cursor:pointer}
#gate{max-width:340px;margin:12vh auto;text-align:center}
</style>
<div id="gate" style="display:none">
  <h1>PinBot 快照</h1>
  <p class="mut" id="gmsg">需要口令</p>
  <p class="mut" style="font-size:12px" id="built"></p>
  <input id="pw" type="password" placeholder="口令" autocomplete="current-password"
         style="width:100%;margin-bottom:8px">
  <button id="go" style="width:100%">解锁</button>
</div>
<div id="app" style="display:none">
  <h1>PinBot 运行快照</h1>
  <div class="mut" id="ts"></div>
  <div id="body"></div>
</div>

const ENCRYPTED = true;

const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const card = (t,b) => { const f = t.endsWith('|full');
  return `<div class="card${f?' full':''}"><h2>${f?t.slice(0,-5):t}</h2>${b}</div>`; };
const row = (k,v,ind=0) =>
  `<div class="row" style="padding-left:${ind*14}px"><span class="${ind?'mut':''}">${esc(k)}</span><b>${esc(v)}</b></div>`;

function render(D){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('ts').textContent = '快照时间 ' + D.snapshot_at + '（静态导出，非实时）';
  const F = D.funnel || {}, pct = (a,b) => b ? Math.round(a/b*100)+'%' : '-';
  let h = '';
  const O = D.ops || {}, W = O.window || {}, U = O.warmup || {};
  h += card('今日产量',
    `<div class="big">${D.today} <span class="mut" style="font-size:13px">/ 上限 ${D.ceiling}</span></div>`
    + row('结构上限', D.ceiling + '/天') + row('速率闸', D.gate + '/h'));
  // 窗口配额排在最前：这是唯一会**直接停产**的硬约束，撞顶就不出号了。
  // 09-04 之前它只在看门狗日志里，看板上一个字都没有。
  if (W.limit) {
    const danger = W.days < 3;
    h += card('窗口配额' + (danger ? ' ⚠' : ''),
      `<div class="big"${danger?' style="color:var(--bad)"':''}>${W.used}<span class="mut" style="font-size:13px">/${W.limit}</span>`
      + ` <span class="mut" style="font-size:13px">还能跑 ${W.days} 天</span></div>`
      + row('每天净增', W.growth + ' 个')
      + `<div class="mut" style="font-size:12px;padding-top:4px">${esc(W.note||'')}</div>`
      + `<div class="mut" style="font-size:12px">已封号的窗口会自动删；存活号的窗口永久占用</div>`);
  }
  // 养号：只显示「养号中 163」会看着很健康 —— 实际 09-04 有 111 个从来没被养过一轮。
  // 「从未养过」才是这块真正的健康指标。
  if (U.warming !== undefined) {
    h += card('养号',
      `<div class="big">${U.today}<span class="mut" style="font-size:13px"> 轮/今日</span></div>`
      + row('在册', U.warming + ' 个')
      + row('从未养过', U.never + ' 个')
      + row('在册上限', U.cap + '（= 近 7 天最好一天的轮次）')
      + row('单轮中位', U.median_min + ' 分钟'));
  }
  h += card('账号漏斗',
    row('总尝试', F.attempts)
    + row('├ 注册成功', `${F.registered_total}  ${pct(F.registered_total,F.attempts)}`)
    + row('│  ├ 现存活', `${F.alive}  ${pct(F.alive,F.registered_total)}`, 1)
    + row('│  │   ├ 待养号', F.pending_warmup, 2)
    + row('│  │   ├ 养号中', F.warming, 2)
    + row('│  │   └ 已交付', F.delivered, 2)
    + row('│  └ 已封禁', `${F.banned_after_reg}  ${pct(F.banned_after_reg,F.registered_total)}`, 1)
    + row('└ 没注册成功', F.not_registered, 0));
  const dm = D.by_provider || [];
  h += card('按邮箱供应商'+'|full', '<div class="wrap"><table><tr><th>供应商</th><th>注册成功</th><th>存活</th><th>已封</th><th>存活率</th></tr>'
    + dm.map(x => `<tr><td>${esc(x.name)}</td><td>${x.reg}</td><td>${x.alive}</td><td>${x.banned}</td>`
      + `<td><b>${x.reg ? Math.round(x.alive/x.reg*100)+'%' : '-'}</b></td></tr>`).join('')
    + '</table></div>');
  h += card('邮箱池', row('outlook 可用', (D.pool||{}).available ?? '-')
    + row('IMAP 可用', D.imap_available ?? '-'));
  // 假设漂移：写死/推导出来的数 vs 现在量到的数。这个项目反复摔的坑就是
  // 「常量当初推导得很像样，再没人拿它跟现实对过」，所以把对账结果摆到台面上。
  const DR = O.drift || [];
  if (DR.length) {
    h += card('假设漂移 ⚠'+'|full', '<div class="wrap"><table><tr><th>项</th><th>假设</th><th>实测</th><th>差</th></tr>'
      + DR.map(x => `<tr><td>${esc(x.name)}<div class="mut" style="font-size:11px">${esc(x.note||'')}</div></td>`
        + `<td>${x.assumed}</td><td>${x.measured}</td>`
        + `<td style="color:var(--bad)"><b>${x.ratio}x</b></td></tr>`).join('')
      + '</table></div>');
  }
  const ev = (D.events||[]).slice(-25).reverse();
  h += card('最近事件'+'|full', '<div class="wrap"><table>'
    + ev.map(e => `<tr><td class="mut"><code>${esc((e.ts||'').slice(11,19))}</code></td>`
      + `<td><code>${esc(e.step||'')}</code></td><td>${esc((e.detail||'').slice(0,70))}</td></tr>`).join('')
    + '</table></div>');
  document.getElementById('body').innerHTML = h;
}

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

if (!ENCRYPTED) {
  render(PAYLOAD);
} else {
  document.getElementById('gate').style.display='';
  // 把快照时间显示在解锁前：换口令后如果浏览器还拿着旧页面，
  // 表现是「口令不对」，但真正的原因是页面过期 —— 有这行就能一眼分辨。
  document.getElementById('built').textContent = '页面数据时间 ' + (PAYLOAD.built_at || '未知');
  const go = async () => {
    const pw = document.getElementById('pw').value;
    if (!pw) return;
    document.getElementById('gmsg').textContent = '解密中…';
    try {
      const D = await unlock(pw);
      try { sessionStorage.setItem('pinbot_pw', pw); } catch(e){}
      render(D);
    } catch(e) {
      document.getElementById('gmsg').textContent =
        '口令不对（若刚改过口令，请强制刷新：Cmd/Ctrl+Shift+R）';
      try { sessionStorage.removeItem('pinbot_pw'); } catch(e2){}
    }
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
  // 同一浏览器会话内记住口令，刷新不用重输（只存在内存级的 sessionStorage）
  try {
    const saved = sessionStorage.getItem('pinbot_pw');
    if (saved) unlock(saved).then(render).catch(()=>{});
  } catch(e){}
}
